# general settings
name: ITS-L #MP-linearViT-B14 #MP-taylor-B8-sigmoid
model_type: ImageCleanModel
scale: 1
num_gpu: 1  # set num_gpu: 0 for cpu mode
manual_seed: 42
phase: 'train'  #new addition
# dataset and data loader settings
datasets:
  train:
    name: TrainSet
    type: Dataset_PairedImage
    dataroot_gt: /home/ubuntu/data/ITS/train/GT #../../../../data/DenseHaze/train/GT
    dataroot_lq: /home/ubuntu/data/ITS/train/hazy # ../../../../data/DenseHaze/train/hazy
    geometric_augs: true  #ԭtrue

    filename_tmpl: '{}_hazy'
    io_backend:
      type: disk

    # data loader
    use_shuffle: true
    num_worker_per_gpu: 1   #ԭΪ8
    batch_size_per_gpu: 2  #ԭΪ4


    ### -------------Progressive training--------------------------
    mini_batch_sizes: [2]             # ԭΪ4,Batch size per gpu
    iters: [10]
    gt_size: 256  # Max patch size for progressive training
    gt_sizes: [256]  # Patch sizes for progressive training.
    ### ------------------------------------------------------------

    ### ------- Training on single fixed-patch size 128x128---------
    # mini_batch_sizes: [8]
    # iters: [300000]
    # gt_size: 224
    # gt_sizes: [256]
    ### ------------------------------------------------------------

    dataset_enlarge_ratio: 1
    pin_memory: true
    prefetch_mode: 'cuda'

  val:
    name: ValSet
    type: Dataset_PairedImage
    dataroot_gt: /home/ubuntu/data/ITS/test/GT  #../../../../data/DenseHaze/test/GT
    dataroot_lq: /home/ubuntu/data/ITS/test/hazy #../../../../data/DenseHaze/test/hazy

    io_backend:
      type: disk

# network structures
network_g:
  type: MSLM
  inp_channels: 3
  dim: [24,48,72,96]
  num_blocks: [4,6,6,8]
  heads: [1,2,4,8]
  num_path: [1,1,1,1]
  qk_norm: 0.5
  offset_clamp: [-3,3]

# path
path:
  root: /home/ubuntu//zengmaowei/MB-TaylorFormerV2
  pretrain_network_g: ~ #/home/ubuntu/zengmaowei/MB-TaylorFormerV2-main/MB-TaylorFormerV2-main/experiments/ITS-L_temp/net_g_4053.pth  # /home/ubuntu/zengmaowei/MB-TaylorFormerV2-main/MB-TaylorFormerV2-main/experiments/ITS-L_39.44/models/net_g_1643825.pth
  strict_load_g: false
  resume_state: ~

# training settings
train:
  total_iter:    2000000  #500000 allsamlpe/batchsize*allepoch 50/2*100=2500 50/2*1
  warmup_iter: -1  # no warm up
  use_grad_clip: true

  # Split 300k iterations into two cycles.
  # 1st cycle: fixed 3e-4 LR for 92k iters.
  # 2nd cycle: cosine annealing (3e-4 to 1e-6) for 208k iters.
  scheduler:
    type: CosineAnnealingRestartCyclicLR
    periods: [2000000]  # 
    restart_weights: [1]
    eta_mins: [0.0000001]

  mixing_augs:
    mixup: false
    mixup_beta: 1.2
    use_identity: true

  optim_g:
    type: AdamW
    lr: !!float 3e-5 #!!float 3e-4
    weight_decay: !!float 1e-4
    betas: [0.9, 0.999]

  # losses
  pixel_opt:
    type: L1Loss
    loss_weight: 1
    reduction: mean

  fft_loss_opt:
    type: FFTLoss
    loss_weight: 0.1
    reduction: mean
#  ca_loss_opt:
#    type: ContrastLoss
#    loss_weight: 0.1
#    ablation: true

# validation settings
val:
  window_size: 8
  val_freq: 1000000000000000
  save_img: False
  rgb2bgr: true
  use_image: true
  use_amp: true
  max_minibatch: 1 #8

  metrics:
    psnr: # metric name, can be arbitrary
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false

# logging settings
logger:
  print_freq: 500
  save_checkpoint_freq: 500000000000000
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500
